server {
    listen 80;
    server_name _;

    # Don't leak nginx version in Server header / error pages
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets (JS/CSS/images) for 1 year (they have content-hash filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Lightweight healthcheck endpoint (Railway shares one healthcheckPath=/health
    # across services; nginx answers 200 here so the web replica reports healthy).
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ── Same-origin API proxy ────────────────────────────────────────────────
    # The SPA and API run on two separate *.up.railway.app hosts, which are
    # DIFFERENT sites under the Public Suffix List. A session cookie set by the
    # API is therefore THIRD-PARTY to the SPA, and modern browsers (Safari always,
    # Chrome/Brave increasingly) block third-party cookies — so login silently
    # fails: the cookie is set but never sent back on get-session.
    #
    # Fix: reverse-proxy /api and /socket.io to the API host from here, so the
    # browser only ever talks to THIS origin. The session cookie then becomes
    # first-party and sticks. Host header + SNI target the API host so Railway's
    # edge routes to the API service (not back into this web service).
    location /api/ {
        proxy_pass https://api-production-b68c0.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host api-production-b68c0.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass Set-Cookie through unchanged (no Domain attr → scoped to this host)
    }

    # Socket.io (WebSocket) — needs connection-upgrade headers to proxy WS frames.
    location /socket.io/ {
        proxy_pass https://api-production-b68c0.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Host api-production-b68c0.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: any unmatched route serves index.html so React Router handles it
    location / {
        try_files $uri $uri/ /index.html;
    }
}
