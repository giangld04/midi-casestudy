server {
    listen 80;
    server_name _;

    # Don't leak nginx version in Server header / error pages
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets (JS/CSS/images) for 1 year (they have content-hash filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unmatched route serves index.html so React Router handles it
    location / {
        try_files $uri $uri/ /index.html;
    }
}
