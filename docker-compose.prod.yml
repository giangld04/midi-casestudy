# Production compose: builds api + web from Dockerfiles, wires up postgres+redis.
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Required env vars (set in .env.production or shell):
#   AUTH_SECRET, DATABASE_URL, REDIS_URL, CORS_ORIGIN, WEB_ORIGIN, AUTH_URL
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
#   GEMINI_API_KEY  (optional — search falls back to ILIKE when absent)

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ama-midi-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ama_midi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-ama_midi_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ama_midi_user} -d ${POSTGRES_DB:-ama_midi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Not exposed to host in production — internal network only
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: ama-midi-redis-prod
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    expose:
      - "6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ama-midi-api-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      WEB_ORIGIN: ${WEB_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ama-midi-web-prod
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_prod_data:
  redis_prod_data:
